[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hunt-v2"
version = "0.1.0"
description = "Scope-safe, evidence-first bug bounty research pipeline"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
huntctl = "hunt_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
