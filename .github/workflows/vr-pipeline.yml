name: VR GitHub-only hunt pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: read

concurrency:
  group: vr-hunt-pipeline
  cancel-in-progress: true

jobs:
  pipeline:
    if: ${{ vars.ENABLE_VR == 'true' && vars.OPENCODE_VERSION != '' && vars.FREE_MODEL_POOL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: src
      OPENCODE_VERSION: ${{ vars.OPENCODE_VERSION }}
      FREE_MODEL_POOL: ${{ vars.FREE_MODEL_POOL }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check model configuration
        id: model-config
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          if [ -n "$OPENCODE_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Go
        if: vars.ENABLE_RECON == 'true' || vars.ENABLE_ACTIVE_RECON == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Install scoped recon tools
        if: vars.ENABLE_RECON == 'true'
        run: |
          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install github.com/projectdiscovery/dnsx/cmd/dnsx@latest
          go install github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install github.com/lc/gau/v2/cmd/gau@latest
          go install github.com/tomnomnom/waybackurls@latest
          python -m pip install --disable-pip-version-check --no-cache-dir "waymore==8.9"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Install optional active Go tools
        if: vars.ENABLE_ACTIVE_RECON == 'true'
        run: |
          go install github.com/projectdiscovery/katana/cmd/katana@latest
          go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          go install github.com/projectdiscovery/naabu/v2/cmd/naabu@latest
          go install github.com/ffuf/ffuf/v2@latest
          go install github.com/tomnomnom/gf@latest
          go install github.com/devploit/nomore403@latest
          go install github.com/zricethezav/gitleaks/v8@latest
          go install github.com/trufflesecurity/trufflehog/v3@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Install optional active Python tools
        if: vars.ENABLE_ACTIVE_RECON == 'true'
        run: |
          git clone --depth 1 --branch 1.4.3 https://github.com/r0oth3x49/ghauri.git "$RUNNER_TEMP/ghauri"
          python -m pip install --disable-pip-version-check --no-cache-dir "$RUNNER_TEMP/ghauri"
          git clone --depth 1 https://github.com/MichaelStott/CRLF-Injection-Scanner.git "$RUNNER_TEMP/crlf-scanner"
          python -m pip install --disable-pip-version-check --no-cache-dir "$RUNNER_TEMP/crlf-scanner"
      - name: Install optional SQLMap checkout
        if: vars.ENABLE_ACTIVE_RECON == 'true'
        run: |
          git clone --depth 1 https://github.com/sqlmapproject/sqlmap.git "$RUNNER_TEMP/sqlmap"
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec python "%s/sqlmap.py" "$@"\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/bin/sqlmap"
          chmod +x "$RUNNER_TEMP/bin/sqlmap"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "SQLMAP_HOME=$RUNNER_TEMP/sqlmap" >> "$GITHUB_ENV"
      - name: Run passive scoped recon
        if: vars.ENABLE_RECON == 'true'
        run: python -m hunt_pipeline run-recon --config config/programs/vr.json --output recon-input --passive-urls
      - name: Restore VR state and knowledge
        uses: actions/cache/restore@v4
        with:
          path: |
            state
            data
            knowledge
          key: hunt-state-vr-${{ github.run_id }}
          restore-keys: |
            hunt-state-vr-
      - name: Install OpenCode
        run: npm install --global "opencode-ai@$OPENCODE_VERSION"
      - name: Collect one scoped VR HEAD
        run: |
          mkdir -p state artifacts/generated data
          if [ -f state/inventory.json ]; then
            cp state/inventory.json state/previous-inventory.json
          fi
          python -m hunt_pipeline collect --config config/programs/vr.json --input inputs/vr.txt --output state/inventory.json --method HEAD --limit 1
      - name: Merge optional passive recon exports
        if: hashFiles('recon-input/*') != ''
        run: python -m hunt_pipeline import-recon --config config/programs/vr.json --input-dir recon-input --base state/inventory.json --output state/inventory.json --limit 1000
      - name: Compute VR inventory delta
        run: |
          if [ -f state/previous-inventory.json ]; then
            python -m hunt_pipeline delta --previous state/previous-inventory.json --current state/inventory.json --output state/delta.json
          else
            python -c "import json; json.dump({'added': [], 'removed': [], 'changed': [], 'counts': {'added': 0, 'removed': 0, 'changed': 0}}, open('state/delta.json', 'w'), indent=2)"
          fi
      - name: Check for meaningful changes
        id: changes
        run: |
          if [ ! -f state/previous-inventory.json ] || python -c "import json; value=json.load(open('state/delta.json')); raise SystemExit(0 if any(value['counts'].values()) else 1)"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Advance state for inventory
        if: hashFiles('state/inventory.json') != ''
        run: |
          python -m hunt_pipeline state-transition --program vr --event inventory_collected --base state || true
          if python -c "import json; d=json.load(open('state/delta.json')); raise SystemExit(0 if any(d.get('counts',{}).values()) else 1)"; then
            python -m hunt_pipeline state-transition --program vr --event delta_found --base state || true
          else
            python -m hunt_pipeline state-transition --program vr --event no_delta --base state || true
          fi
      - name: Build VR hypothesis prompt with RAG context
        if: hashFiles('state/inventory.json') != ''
        run: python -m hunt_pipeline hypothesis-prompt --inventory state/inventory.json --delta state/delta.json --output state/hypothesis-prompt.txt --program vr --knowledge-base knowledge
      - name: Generate VR candidate leads
        if: hashFiles('state/hypothesis-prompt.txt') != '' && steps.changes.outputs.changed == 'true' && steps.model-config.outputs.enabled == 'true'
        run: |
          python -m hunt_pipeline model-run --agent hypothesis --mode hypothesis --prompt state/hypothesis-prompt.txt --output artifacts/hypothesis-raw.json --inventory state/inventory.json --delta state/delta.json --program vr --rotation "$GITHUB_RUN_NUMBER" --attempts artifacts/model-attempts/hypothesis
          python -m hunt_pipeline import-leads --input artifacts/hypothesis-raw.json --inventory state/inventory.json --delta state/delta.json --program vr --output artifacts/generated/leads.json
      - name: Ingest VR leads
        if: hashFiles('artifacts/generated/leads.json') != ''
        run: python -m hunt_pipeline --db data/hunt.sqlite ingest --config config/programs/vr.json --input artifacts/generated/leads.json
      - name: Advance state for leads and verify
        if: hashFiles('artifacts/generated/leads.json') != ''
        env:
          OOB_DOMAIN: ${{ vars.OOB_DOMAIN }}
          INTERACTSH_DOMAIN: ${{ vars.INTERACTSH_DOMAIN }}
          VR_AUTH_TOKEN: ${{ secrets.VR_AUTH_TOKEN }}
        run: |
          python -m hunt_pipeline state-transition --program vr --event leads_generated --base state || true
          if [ -f config/auth/vr.json ]; then
            AUTH_FLAG="--auth-config config/auth/vr.json"
          else
            AUTH_FLAG=""
          fi
          if [ -n "${OOB_DOMAIN:-}" ] || [ -n "${INTERACTSH_DOMAIN:-}" ]; then
            OOB_FLAG="--use-oob"
          else
            OOB_FLAG=""
          fi
          python -m hunt_pipeline verify --config config/programs/vr.json --input artifacts/generated/leads.json --output artifacts/verification.json $AUTH_FLAG $OOB_FLAG || true
          if [ -f artifacts/verification.json ]; then
            python -m hunt_pipeline state-transition --program vr --event verified --base state || true
          fi
      - name: Poll OOB callbacks
        if: hashFiles('artifacts/verification.json') != ''
        env:
          INTERACTSH_TOKEN: ${{ secrets.INTERACTSH_TOKEN }}
          INTERACTSH_POLL_URL: ${{ secrets.INTERACTSH_POLL_URL }}
        run: |
          if [ -f artifacts/verification.json ] && python -c "import json; data=json.load(open('artifacts/verification.json')); raise SystemExit(0 if any(x.get('oob_token') for x in data) else 1)"; then
            for token in $(python -c "import json; print(' '.join(x.get('oob_token','') for x in json.load(open('artifacts/verification.json')) if x.get('oob_token')) )"); do
              python -m hunt_pipeline oob-check --program vr --token "$token" --base state || true
            done
          fi
      - name: Build VR triage prompt
        if: hashFiles('artifacts/generated/leads.json') != ''
        run: |
          if python -c "import json; raise SystemExit(0 if len(json.load(open('artifacts/generated/leads.json'))) else 1)"; then
            python -m hunt_pipeline prompt --inbox artifacts/generated --output state/triage-prompt.txt
          fi
      - name: Run first VR triage model
        if: hashFiles('state/triage-prompt.txt') != '' && steps.model-config.outputs.enabled == 'true'
        run: python -m hunt_pipeline model-run --agent triage --mode triage --prompt state/triage-prompt.txt --output artifacts/triage-a.json --rotation "$GITHUB_RUN_NUMBER" --attempts artifacts/model-attempts/triage-a
      - name: Run second VR triage model
        if: hashFiles('state/triage-prompt.txt') != '' && steps.model-config.outputs.enabled == 'true'
        run: |
          exclude_model=$(python -c 'import json; print(json.load(open("artifacts/triage-a.json"))["model"])')
          python -m hunt_pipeline model-run --agent triage --mode triage --prompt state/triage-prompt.txt --output artifacts/triage-b.json --rotation "$GITHUB_RUN_NUMBER" --exclude "$exclude_model" --attempts artifacts/model-attempts/triage-b
      - name: Build VR triage consensus
        if: hashFiles('artifacts/triage-a.json') != '' && hashFiles('artifacts/triage-b.json') != ''
        run: python -m hunt_pipeline consensus --input artifacts/triage-a.json --input artifacts/triage-b.json --output artifacts/triage-consensus.json
      - name: Store VR consensus verdicts
        if: hashFiles('artifacts/triage-consensus.json') != ''
        run: python -m hunt_pipeline --db data/hunt.sqlite ingest-verdicts --input artifacts/triage-consensus.json --model consensus
      - name: Store VR single-model fallback
        if: hashFiles('artifacts/triage-consensus.json') == '' && hashFiles('artifacts/triage-a.json') != ''
        run: python -m hunt_pipeline --db data/hunt.sqlite ingest-verdicts --input artifacts/triage-a.json --model free-pool-fallback
      - name: Update knowledge from triage
        if: hashFiles('artifacts/triage-consensus.json') != '' || hashFiles('artifacts/triage-a.json') != ''
        run: |
          if [ -f artifacts/triage-consensus.json ]; then
            INPUT=artifacts/triage-consensus.json
          else
            INPUT=artifacts/triage-a.json
          fi
          python - <<'PY' || true
          import json
          from pathlib import Path
          from hunt_pipeline.knowledge import add_rejected, add_learning
          try:
              data = json.loads(Path("artifacts/triage-consensus.json" if Path("artifacts/triage-consensus.json").exists() else "artifacts/triage-a.json").read_text())
              for item in data.get("results", []):
                  if item.get("verdict") == "INVALID" and item.get("gate"):
                      add_rejected("vr", "UNKNOWN", item.get("lead_id",""), item.get("reason","")[:200], "knowledge")
                  if item.get("verdict") == "VALID":
                      add_learning("vr", f"ACCEPTED {item.get('lead_id')}: {item.get('reason','')[:200]}", "knowledge")
          except Exception as e:
              print(f"knowledge update skipped: {e}")
          PY
          python -m hunt_pipeline state-transition --program vr --event verdicts_recorded --base state || true
      - name: Generate feedback report and update knowledge
        if: hashFiles('data/hunt.sqlite') != ''
        run: |
          python -m hunt_pipeline feedback-report --output artifacts/feedback-report.md --program vr || true
          python -m hunt_pipeline state-transition --program vr --event knowledge_updated --base state || true
      - name: Save VR state and knowledge
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state
            data
            knowledge
          key: hunt-state-vr-${{ github.run_id }}
      - name: Upload VR review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vr-review-${{ github.run_id }}
          path: |
            artifacts
            state
            data/hunt.sqlite
            recon-input
            knowledge
            artifacts/verification.json
            artifacts/feedback-report.md
          if-no-files-found: ignore
