name: Publish human-approved leads

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: publish-approved-leads
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Publish approved approvals
        run: python -m hunt_pipeline publish --approvals approved --repo "$GITHUB_REPOSITORY" --execute
